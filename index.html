<!-- Логика инициализации VK Bridge (из index1) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof vkBridge === 'undefined') {
        console.error('Ошибка: VK Bridge не найден! Показываю приложение без интеграции ВК.');
        document.getElementById('app').style.display = 'block';
        return;
    }
    try {
        vkBridge.send('VKWebAppInit')
            .then(function(data) {
                console.log('VK Web App инициализирован:', data);
                document.getElementById('app').style.display = 'block';
                return vkBridge.send('VKWebAppGetLaunchParams');
            })
            .then(function(launchParams) {
                console.log('Параметры запуска получены:', launchParams);
                if (launchParams && launchParams.scheme) applyTheme(launchParams.scheme);
            })
            .catch(function(error) {
                console.error('Ошибка инициализации VK Bridge:', error);
                document.getElementById('app').style.display = 'block';
            });
        vkBridge.subscribe(function(event) {
            if (event.detail && event.detail.type === 'VKWebAppUpdateConfig') {
                applyTheme(event.detail.data.scheme);
            }
        });
    } catch (e) {
        console.error('Критическая ошибка при инициализации VK Bridge:', e);
        document.getElementById('app').style.display = 'block';
    }
    function applyTheme(scheme) {
        console.log('Применяется тема:', scheme);
        document.documentElement.style.setProperty('--vk-color-scheme', scheme);
        if (scheme === 'vkcom_dark' || scheme === 'space_gray') document.body.classList.add('dark-theme');
        else document.body.classList.remove('dark-theme');
    }
});
</script>

                    console.warn(tag + ' «' + team + '»: ожидается ' + (BASE_COLS.length + 3) + ' значений (команда + 9 дисциплин + очки + место), найдено ' + row.length + '. Если добавляете ГТО — используйте объектный формат строки.');
                }
            } else if (row && typeof row === 'object') {
                Object.keys(row.disc || {}).forEach(function (k) {
                    if (ids.indexOf(k) === -1) console.warn(tag + ' неизвестный id дисциплины «' + k + '» (допустимые: ' + ids.join(', ') + ')');
                });
            }
        });
    });
}

/* ============================================================
   5. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ============================================================ */
function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
}
function medalFor(p) { return p === 1 ? '🥇' : (p === 2 ? '🥈' : (p === 3 ? '🥉' : null)); }
function fmtNum(n) {
    if (n === null || n === undefined) return '';
    if (typeof n === 'string') return n;
    return (typeof n === 'number' && n % 1 !== 0) ? String(n).replace('.', ',') : String(n);
}
function placeCell(p, emptyText) {
    if (p === null || p === undefined) return '<span class="no-part">' + emptyText + '</span>';
    const m = medalFor(p);
    return m ? '<span class="place-medal">' + m + ' ' + fmtNum(p) + '</span>' : fmtNum(p);
}
function placeBadge(p) {
    if (p === null || p === undefined) return '<span class="badge badge-muted">нет данных</span>';
    const m = medalFor(p);
    if (m) {
        const cls = (p === 1) ? 'badge-gold' : ((p === 2) ? 'badge-silver' : 'badge-bronze');
        return '<span class="badge ' + cls + '">' + m + ' ' + fmtNum(p) + ' место</span>';
    }
    return '<span class="badge badge-muted">' + fmtNum(p) + ' место</span>';
}
/* Место в дисциплине за конкретный год:
   до включения в программу (или после исключения) — «не проводилась»,
   иначе — обычное место («без участия», если null). */
function discCell(d, year, value) {
    if (!discHeldIn(d, year)) return '<span class="not-held">не проводилась</span>';
    return placeCell(value, 'без участия');
}
function getPeriod(data) {
    const years = Object.keys(data).map(Number).sort(function (a, b) { return a - b; });
    if (!years.length) return '';
    return (years[0] === years[years.length - 1]) ? String(years[0]) : (years[0] + '–' + years[years.length - 1]);
}
function getChampion(data, year) {
    const w = Object.entries(data[year] || {}).find(function (e) { return e[1].place === 1; });
    return w ? w[0] : null;
}
function computeChampionGroups(data) {
    const years = Object.keys(data).map(Number).sort(function (a, b) { return a - b; });
    const groups = [];
    years.forEach(function (year) {
        const champ = getChampion(data, year);
        const last = groups[groups.length - 1];
        if (last && last.team === champ) { last.to = year; last.count++; }
        else groups.push({ team: champ, from: year, to: year, count: 1 });
    });
    return groups;
}
function getGroupTeams(data) {
    const set = new Set();
    Object.values(data).forEach(function (y) { Object.keys(y).forEach(function (t) { set.add(t); }); });
    return Array.from(set).sort(function (a, b) { return a.localeCompare(b, 'ru'); });
}
function getTeamYears(team) {
    const data = getGroupData();
    const res = [];
    Object.keys(data).map(Number).sort(function (a, b) { return a - b; }).forEach(function (year) {
        const v = data[year][team];
        if (!v) return;
        const hasDisc = Object.values(v.disc).some(function (x) { return x !== null && x !== undefined; });
        if (v.place === null && !hasDisc) return;
        res.push({ year: year, place: v.place, disc: v.disc });
    });
    return res;
}
/* ============================================================
   5.1 ТОП-3 КОМАНД ПО ЧИСЛУ ПОБЕД В ДИСЦИПЛИНАХ
   Победа = 1-е место в дисциплине в конкретном году.
   Равное число побед -> общее место (после двух первых
   идёт третье: 1, 1, 3 — место не «уплотняется»).
   ============================================================ */
function computeDiscWins(data, discId) {
    const wins = {};
    Object.keys(data).forEach(function (year) {
        Object.entries(data[year]).forEach(function (e) {
            if (e[1].disc[discId] === 1) wins[e[0]] = (wins[e[0]] || 0) + 1;
        });
    });
    return wins;
}
function rankWithTies(winsObj) {
    const entries = Object.entries(winsObj);
    if (!entries.length) return [];
    entries.sort(function (a, b) {
        if (b[1] !== a[1]) return b[1] - a[1];
        return a[0].localeCompare(b[0], 'ru');
    });
    const groups = [];
    let place = 0, prevWins = null;
    entries.forEach(function (e, i) {
        if (e[1] !== prevWins) { place = i + 1; prevWins = e[1]; }
        const last = groups[groups.length - 1];
        if (last && last.wins === e[1]) last.teams.push(e[0]);
        else groups.push({ place: place, wins: e[1], teams: [e[0]] });
    });
    return groups;
}
function discTop3Html(discId) {
    const groups = rankWithTies(computeDiscWins(getGroupData(), discId))
        .filter(function (g) { return g.place <= 3; });
    if (!groups.length) return '';
    let html = '<div class="podium">';
    groups.forEach(function (g) {
        const m = g.place === 1 ? '🥇' : (g.place === 2 ? '🥈' : '🥉');
        g.teams.forEach(function (t) {
            html += '<div class="podium-item"><span class="medal">' + m + '</span>' +
                '<span class="team">' + t + '</span>' +
                '<span class="badge badge-muted">' + g.wins + ' ' + plural(g.wins, 'победа', 'победы', 'побед') + '</span></div>';
        });
    });
    return html + '</div>';
}
function renderDiscTop3Card() {
    const data = getGroupData();
    let rows = '';
    DISCIPLINES.forEach(function (d) {
        const groups = rankWithTies(computeDiscWins(data, d.id))
            .filter(function (g) { return g.place <= 3; });
        if (!groups.length) return;
        let cells = '';
        [1, 2, 3].forEach(function (place) {
            const grp = groups.filter(function (g) { return g.place === place; })[0];
            cells += '<td>' + (grp
                ? grp.teams.map(function (t) { return t + ' — ' + grp.wins + ' ' + plural(grp.wins, 'победа', 'победы', 'побед'); }).join('<br>')
                : '<span class="no-part">—</span>') + '</td>';
        });
        rows += '<tr><td>' + d.label + '</td>' + cells + '</tr>';
    });
    if (!rows) return '';
    return '<div class="card"><h2>🥇 Топ-3 команд по победам в дисциплинах</h2>' +
        '<p>Число побед (1-х мест) в каждой дисциплине за всю известную историю. Команды с равным числом побед делят место.</p>' +
        '<table><tr><th>Дисциплина</th><th>1-е место</th><th>2-е место</th><th>3-е место</th></tr>' + rows + '</table></div>';
}

    const top3 = discTop3Html(discId);
    if (top3) html += '<h3>🥇 Топ-3 команд по числу побед за всю историю</h3>' + top3;

    /* только годы, где дисциплина была в программе И есть хоть один результат */
    const activeYears = years.filter(function (y) {
        if (!discHeldIn(d, y)) return false;
        return Object.values(data[y]).some(function (v) { return v.disc[d.id] !== null; });
    });

    if (!activeYears.length) {
        html += '<p style="margin-top:10px;">Данных по дисциплине за известные годы (' + years[0] + '–' + years[years.length - 1] + ') пока нет.</p>';
        el.innerHTML = html;
        return;
    }

    activeYears.forEach(function (year, idx) {
        const rows = Object.entries(data[year]).map(function (e) { return { team: e[0], place: e[1].disc[d.id] }; });
        rows.sort(function (a, b) {
            if (a.place === null && b.place === null) return a.team.localeCompare(b.team, 'ru');
            if (a.place === null) return 1;
            if (b.place === null) return -1;
            return a.place - b.place;
        });
        const champ = rows.find(function (r) { return r.place === 1; });

        let header = '<span class="title"><h3>' + year + '</h3>';
        if (champ) header += ' <span class="badge badge-gold">🏆 ' + champ.team + '</span>';
        else header += ' <span class="badge badge-muted">чемпион не определён</span>';
        header += '</span>';

        let detail = '<table><tr><th>Команда</th><th>Место в дисциплине</th></tr>';
        rows.forEach(function (r) {
            detail += '<tr class="' + (r.place === 1 ? 'highlight' : '') + '"><td>' + r.team + '</td><td>' + placeCell(r.place, 'без участия') + '</td></tr>';
        });
        detail += '</table>';
        if (YEAR_NOTES[state.group][year]) detail += '<div class="year-note">⚠️ ' + YEAR_NOTES[state.group][year] + '</div>';

        html += '<div class="year-block' + (idx === activeYears.length - 1 ? ' open' : '') + '" data-year="' + year + '">' +
            '<div class="header">' + header + '<span class="arrow">▼</span></div>' +
            '<div class="year-detail">' + detail + '</div></div>';
    });
    el.innerHTML = html;
}

function normalizeData(rawYears, rawMatches) {
    const years = {};
    for (const [year, data] of Object.entries(rawYears)) {
        const newData = Object.assign({}, data);
        if (data.places) {
            const newPlaces = {};
            for (const [team, place] of Object.entries(data.places)) newPlaces[normalizeTeam(team)] = place;
            newData.places = newPlaces;
        }
        if (data.champion) newData.champion = normalizeTeam(data.champion);
        years[year] = newData;
    }
    const matches = {};
    for (const [year, list] of Object.entries(rawMatches)) {
        matches[year] = list.map(function (m) { return [normalizeTeam(m[0]), normalizeTeam(m[1]), m[2]]; });
    }
    return { years: years, matches: matches };
}
const normalized = normalizeData(rawYearsData, rawMatchesData);
const yearsData = normalized.years;
const matchesData = normalized.matches;

function getTeamAppearances(team) {
    const appearances = [];
    for (const [year, data] of Object.entries(yearsData)) {
        let place = null;
        if (data.places && data.places[team] !== undefined) place = data.places[team];
        else if (matchesData[year] && matchesData[year].some(function (m) { return m[0] === team || m[1] === team; })) place = 'участник';
        if (place !== null) appearances.push({ year: year, place: place });
    }
    return appearances;
}
function getAllTeams() {
    const set = new Set();
    Object.values(yearsData).forEach(function (y) { if (y.places) Object.keys(y.places).forEach(function (t) { set.add(t); }); });
    Object.values(matchesData).forEach(function (list) { list.forEach(function (m) { set.add(m[0]); set.add(m[1]); }); });
    return Array.from(set).sort();
}
function getVideoLink(year, team1, team2, score) {
    if (!videoLinks[year]) return null;
    const found = videoLinks[year].find(function (v) { return v.team1 === team1 && v.team2 === team2 && v.score === score; });
    return found ? found.url : null;
}
function getTeamSeasonsCount() {
    const result = {};
    getAllTeams().forEach(function (team) {
        const yearsSet = new Set();
        for (const year of Object.keys(yearsData)) {
            if (yearsData[year].places && yearsData[year].places[team] !== undefined) yearsSet.add(year);
        }
        for (const year of Object.keys(matchesData)) {
            if (matchesData[year] && matchesData[year].some(function (m) { return m[0] === team || m[1] === team; })) yearsSet.add(year);
        }
        result[team] = yearsSet.size;
    });
    return result;
}
function getCleanSheetsFullSeason() {
    const cleanMap = {};
    const yearsRange = Object.keys(matchesData).filter(function (y) { return parseInt(y, 10) >= 2013 && parseInt(y, 10) <= 2026; });
    for (const year of yearsRange) {
        const matches = matchesData[year];
        if (!matches) continue;
        const teamGoalsConceded = {};
        matches.forEach(function (m) {
            const parts = m[2].match(/(\d+)\s*:\s*(\d+)/);
            if (!parts) return;
            const g1 = parseInt(parts[1], 10), g2 = parseInt(parts[2], 10);
            teamGoalsConceded[m[0]] = (teamGoalsConceded[m[0]] || 0) + g2;
            teamGoalsConceded[m[1]] = (teamGoalsConceded[m[1]] || 0) + g1;
        });
        for (const team of Object.keys(teamGoalsConceded)) {
            if (teamGoalsConceded[team] === 0) {
                if (!cleanMap[team]) cleanMap[team] = [];
                cleanMap[team].push(year);
            }
        }
    }
    const result = {};
    for (const [team, arr] of Object.entries(cleanMap)) result[team] = arr.sort(function (a, b) { return a - b; });
    return result;
}
function fbYearChampion(year) {
    const d = yearsData[year];
    if (!d || !d.places) return null;
    const w = Object.entries(d.places).find(function (e) { return e[1] === 1; });
    return w ? w[0] : null;
}

function fbRenderTeamInfo(team) {
    const info = document.getElementById('fbTeamInfo');
    if (!info) return;
    if (!team) { info.innerHTML = 'Выберите команду для отображения.'; return; }
    const appearances = getTeamAppearances(team).sort(function (a, b) { return a.year - b.year; });
    let html = '<h3>' + team + '</h3>';
    if (!appearances.length) { info.innerHTML = html + '<p>Нет данных об участии.</p>'; return; }
    html += '<table><tr><th>Год</th><th>Место</th></tr>';
    appearances.forEach(function (a) {
        const p = (a.place === 'участник') ? 'нет данных' : a.place;
        const m = (typeof p === 'number') ? medalFor(p) : null;
        html += '<tr><td>' + a.year + '</td><td>' + (m ? '<span class="place-medal">' + m + ' ' + p + '</span>' : p) + '</td></tr>';
    });
    html += '</table>';
    const numeric = appearances.filter(function (a) { return typeof a.place === 'number'; });
    if (numeric.length) {
        const best = Math.min.apply(null, numeric.map(function (a) { return a.place; }));
        const bestYears = numeric.filter(function (a) { return a.place === best; }).map(function (a) { return a.year; });
        html += '<p style="margin-top:12px;"><strong>Лучший результат:</strong> ' + best + '-е место (' + bestYears.join(', ') + ')</p>';
        const c = { 1: 0, 2: 0, 3: 0 };
        numeric.forEach(function (a) { if (c[a.place] !== undefined) c[a.place]++; });
        html += '<p><strong>Медали:</strong> 🥇 × ' + c[1] + ' · 🥈 × ' + c[2] + ' · 🥉 × ' + c[3] + '</p>';
    }
    const seasons = getTeamSeasonsCount();
    html += '<p><strong>Сезонов участия:</strong> ' + (seasons[team] || appearances.length) + '</p>';
    const cs = getCleanSheetsFullSeason();
    if (cs[team]) html += '<p><strong>«Сухие» сезоны (0 пропущенных голов):</strong> ' + cs[team].join(', ') + '</p>';
    info.innerHTML = html;
}

        (csRows ? '<table><tr><th>Команда</th><th>Годы</th></tr>' + csRows + '</table>' : '<p>Нет данных.</p>') +
        '</div>';
}

/* ============================================================
   13. ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
   ============================================================ */
document.addEventListener('click', function (e) {
    const gBtn = e.target.closest('#groupSwitch button');
    if (gBtn) { switchGroup(gBtn.dataset.group); return; }

    const tBtn = e.target.closest('#mainTabs button');
    if (tBtn) {
        state.tab = tBtn.dataset.tab;
        renderTabs();
        renderContent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
    }

    const sBtn = e.target.closest('[data-fb]');
    if (sBtn) {
        const root = sBtn.closest('[data-sport]');
        if (root) {
            const prefix = root.dataset.sport;
            root.querySelectorAll('.nav-tabs button').forEach(function (b) { b.classList.toggle('active', b === sBtn); });
            root.querySelectorAll('.section').forEach(function (s) { s.classList.toggle('active', s.id === prefix + '-' + sBtn.dataset.fb); });
        }
        return;
    }

    const yHead = e.target.closest('.year-block .header');
    if (yHead) { yHead.closest('.year-block').classList.toggle('open'); }
});

document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('year-filter')) {
        const val = e.target.value.trim().toLowerCase();
        const card = e.target.closest('.card');
        if (card) {
            card.querySelectorAll('.year-block').forEach(function (b) {
                b.style.display = (b.dataset.year || '').includes(val) ? '' : 'none';
            });
        }
    }
});

document.addEventListener('change', function (e) {
    if (e.target.id === 'teamSelect') renderTeamResultsUI(e.target.value);
    else if (e.target.id === 'discSelect') renderDiscResultsUI(e.target.value);
    else if (e.target.id === 'fbTeamSelect') fbRenderTeamInfo(e.target.value);
});

/* ============================================================
   14. ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
switchGroup('undefined');

})();
</script>
